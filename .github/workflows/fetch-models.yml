name: fetch-models-v2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -U huggingface_hub

      - name: Download Qwen3-1.7B (約 1.3GB)
        run: |
          mkdir -p dl
          hf download unsloth/Qwen3-1.7B-GGUF --include "*Q4_K_M.gguf" --local-dir t17
          mv t17/*Q4_K_M.gguf dl/

      - name: Download Qwen3-4B-Instruct-2507 (約 2.3GB，需切檔)
        run: |
          hf download unsloth/Qwen3-4B-Instruct-2507-GGUF --include "*Q4_K_M.gguf" --local-dir t4
          cd t4
          f=$(ls *Q4_K_M.gguf)
          split -b 1900M -d "$f" "../dl/$f.part"

      - name: Checksums
        run: cd dl && sha256sum * > SHA256SUMS.txt

      - name: Publish release
        run: |
          gh release create models-v2 dl/* -t "models-v2" -n "model files v2" \
          || gh release upload models-v2 dl/* --clobber
